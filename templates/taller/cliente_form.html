{% extends "base.html" %}
{% block title %}Nuevo Cliente — Grupo Soldador M.A.M{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <div class="crumb">Páginas / Clientes / Nuevo</div>
    <h1>Registrar Cliente</h1>
  </div>
</div>

<div class="card form-card">
  <div class="form-head">
    <div class="fic orange"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg></div>
    <div>
      <h2>Datos del cliente</h2>
      <p>Se usará para ligar sus cotizaciones y vehículos.</p>
    </div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <div class="field full">
        <label>Nombre completo <span class="req">*</span></label>
        <input type="text" name="nombre" required placeholder="Ej. Juan Pérez García">
      </div>
      <div class="field">
        <label>Teléfono</label>
        <input type="text" name="telefono" placeholder="555-0000">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" placeholder="correo@ejemplo.com">
      </div>
      <div class="field full">
        <label>Dirección</label>
        <input type="text" name="direccion" placeholder="Calle, número, colonia">
      </div>
    </div>
    <div class="cta-row" style="margin-top:22px;margin-bottom:0">
      <button class="btn btn-primary" type="submit"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>GUARDAR CLIENTE</button>
      <a class="btn btn-outline" href="{% url 'clientes' %}">CANCELAR</a>
    </div>
  </form>
</div>
{% endblock %}
