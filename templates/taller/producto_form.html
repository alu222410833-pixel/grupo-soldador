{% extends "base.html" %}
{% block title %}Nuevo Producto — Grupo Soldador M.A.M{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <div class="crumb">Páginas / Inventario / Nuevo</div>
    <h1>Nuevo Producto</h1>
  </div>
</div>

<div class="card form-card">
  <div class="form-head">
    <div class="fic blue"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-14v10M4 7v10l8 4"/></svg></div>
    <div>
      <h2>Producto o servicio</h2>
      <p>Se mostrará en el inventario y al cotizar.</p>
    </div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <div class="field">
        <label>Código / SKU <span class="req">*</span></label>
        <input type="text" name="codigo" required placeholder="Ej. ELEC-7018">
      </div>
      <div class="field">
        <label>Tipo <span class="req">*</span></label>
        <select name="tipo">
          {% for valor, etiqueta in tipos %}
          <option value="{{ valor }}">{{ etiqueta }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field full">
        <label>Nombre <span class="req">*</span></label>
        <input type="text" name="nombre" required placeholder="Ej. Electrodo 7018 1/8 pulgada">
      </div>
      <div class="field">
        <label>Precio unitario (MXN) <span class="req">*</span></label>
        <input type="number" name="precio_unitario" step="0.01" min="0" required placeholder="0.00">
      </div>
      <div class="field">
        <label>Stock inicial</label>
        <input type="number" name="stock" min="0" value="0">
      </div>
      <div class="field">
        <label>Stock mínimo (alerta)</label>
        <input type="number" name="stock_minimo" min="0" value="3">
      </div>
    </div>
    <div class="cta-row" style="margin-top:22px;margin-bottom:0">
      <button class="btn btn-primary" type="submit"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>GUARDAR PRODUCTO</button>
      <a class="btn btn-outline" href="{% url 'inventario' %}">CANCELAR</a>
    </div>
  </form>
</div>
{% endblock %}
