{% extends "base.html" %}
{% block title %}Nuevo Servicio — Grupo Soldador M.A.M{% endblock %}
{% block content %}
<div class="topbar">
  <div>
    <div class="crumb">Páginas / Servicios / Nuevo</div>
    <h1>Nuevo Servicio</h1>
  </div>
</div>

<div class="card form-card">
  <div class="form-head">
    <div class="fic green"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.7 2.7-2.7-2.7 2.4-3z"/></svg></div>
    <div>
      <h2>Servicio de mano de obra</h2>
      <p>No lleva stock — solo precio por hora o por trabajo.</p>
    </div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-grid">
      <div class="field">
        <label>Código <span class="req">*</span></label>
        <input type="text" name="codigo" required placeholder="Ej. MO-SOLD">
      </div>
      <div class="field">
        <label>Precio (MXN) <span class="req">*</span></label>
        <input type="number" name="precio_unitario" step="0.01" min="0" required placeholder="0.00">
      </div>
      <div class="field full">
        <label>Nombre <span class="req">*</span></label>
        <input type="text" name="nombre" required placeholder="Ej. Soldadura por hora">
      </div>
      <div class="field full">
        <label>Descripción</label>
        <input type="text" name="descripcion" placeholder="Ej. Reparación de estructura, cobro por hora trabajada">
      </div>
    </div>
    <div class="cta-row" style="margin-top:22px;margin-bottom:0">
      <button class="btn btn-primary" type="submit"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>GUARDAR SERVICIO</button>
      <a class="btn btn-outline" href="{% url 'servicios' %}">CANCELAR</a>
    </div>
  </form>
</div>
{% endblock %}
