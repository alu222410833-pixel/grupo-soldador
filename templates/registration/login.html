<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Grupo Soldador M.A.M</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    color: #fff;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(0,117,255,.25), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(33,212,253,.12), transparent 55%),
      #060D26;
  }
  .box {
    width: 360px; max-width: 100%; padding: 36px;
    background: linear-gradient(127deg, #060C28 0%, #0A1235 100%);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px;
  }
  .mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #F97316, #FF9A3C);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #060D26;
    box-shadow: 0 0 22px rgba(249,115,22,.45);
    margin-bottom: 18px;
  }
  h1 { font-size: 19px; margin-bottom: 4px; }
  .sub { color: #A0AEC0; font-size: 12.5px; margin-bottom: 26px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #A0AEC0; margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 14px; margin-bottom: 16px;
    background: #0F1534; border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; color: #fff; font-family: inherit; font-size: 14px;
    outline: none;
  }
  input:focus { border-color: #F97316; box-shadow: 0 0 14px rgba(249,115,22,.3); }
  input::placeholder { color: #4A5878; }
  button {
    width: 100%; height: 44px; margin-top: 4px;
    background: linear-gradient(135deg, #F97316, #FF8A00);
    color: #fff; border: none; border-radius: 12px;
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .02em;
    cursor: pointer; box-shadow: 0 4px 20px rgba(249,115,22,.4);
  }
  .error { color: #F56565; font-size: 12.5px; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="mark">M</div>
  <h1>Grupo Soldador M.A.M</h1>
  <div class="sub">Acceso exclusivo para empleados</div>
  {% if form.errors %}<div class="error">Usuario o contraseña incorrectos.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>USUARIO</label>
    <input type="text" name="username" autofocus required>
    <label>CONTRASEÑA</label>
    <input type="password" name="password" required>
    <button type="submit">ENTRAR</button>
  </form>
</div>
</body>
</html>
